name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io under the
# io.github.silverbackmarketing namespace. Runs here (not the website repo)
# because the registry's GitHub OIDC auth grants the namespace of the org
# that owns the repository the workflow runs in.
on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Login via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
